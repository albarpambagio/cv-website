    projects:
      - name: '[Indonesia Food Price Intelligence](https://github.com/albarpambagio/indonesia-food-price-intelligence)'
        date: In Progress
        summary: Built a procurement intelligence tool for FMCG Category Managers sourcing rice, cooking oil, sugar, and
          flour across Indonesia. Analyzed 17 years of WFP price data across 224 markets to map seasonal spikes (Ramadan
          premium on sugar, Q2 harvest discount on rice), a 30% persistent price gap between Eastern Indonesia and Java 
          for cooking oil, and a 3-month leading relationship between oil and flour prices. Includes a 6-month price 
          forecast with explicit confidence intervals to guide procurement timing decisions.
      - name: '[Pharmacy Retail Sales Analytics](https://github.com/albarpambagio/pharmacy-retail-sales-analytics)'
        date: May 18 – May 26, 2026
        summary: Analyzed a hospital pharmacy's full-year sales data to surface margin risk and inform 2016 procurement 
          decisions. Identified 2 branded SKUs selling below cost and mapped revenue concentration patterns across 
          inpatient and outpatient channels. Delivered a 3-page interactive dashboard — with a margin threshold slider 
          and CSV export — for the Pharmacy Director and Finance team to act on product pricing and procurement 
          priorities.
      - name: '[Olist Marketing Funnel: Channel Performance & LTV Analysis](https://github.com/albarpambagio/olist-marketing-report)'
        date: May 8 – May 18, 2026
        summary: "Investigated why Social — Olist's second-highest-volume acquisition channel — converted at only half the
          rate of Paid and Organic Search. Found the root cause in channel deal composition: Social's closed deals skewed
          nearly twice as heavy in high-maintenance seller profiles compared to other channels, a structural drag on conversion
          rather than a lead quality issue. Delivered a 4-page Power BI dashboard with channel LTV and funnel analysis to
          support VP Marketing budget allocation for Q3 2018."
    skills:
